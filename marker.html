<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downbeat spike marker</title>
<style>
  @page { size: letter portrait; margin: 0.5in; }
  body { margin: 0; font: 14px system-ui, sans-serif; color: #111; background: #fff; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  img { width: 7.5in; height: 10in; display: block; }
  .note { max-width: 7.5in; }
  @media print { .note { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="note"><b>Print at 100 percent (no scaling) on US letter, portrait.</b> The image must measure 10 in (25.4 cm) tall. Tape it flat on the floor at your spike, with the red bar pointing upstage.</div>
  <img src="/image-targets/spike_original.jpg" alt="Downbeat spike marker">
</div>
</body>
</html>
