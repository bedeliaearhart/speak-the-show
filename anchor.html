<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Downbeat shared view</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eceef2; font: 15px system-ui, sans-serif; overflow: hidden; }
  #camerafeed { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 5; background: rgba(14,15,18,0.85); border: 1px solid #00e5ff; border-radius: 10px; padding: 10px; }
  #badge { font-weight: 700; }
  .sub { color: #9aa0ab; font-size: 13px; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: #00e5ff; color: #000; font-weight: 600; margin-top: 8px; }
  button.secondary { background: #2a2d36; color: #eceef2; }
  label { font-size: 12px; color: #9aa0ab; }
  input { width: 90px; background: #0b0c0f; color: #eceef2; border: 1px solid #2a2d36; border-radius: 6px; padding: 6px; font: inherit; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
</head>
<body>
<canvas id="camerafeed"></canvas>
<div id="ui">
  <div id="badge">Loading the locked design...</div>
  <div id="status" class="sub">Print the marker at /marker.html and tape it at the spike, red bar upstage.</div>
  <div><label>Printed marker height (cm)</label> <input id="markerCm" type="number" step="0.1" value="25.4"></div>
  <button id="start">Start shared AR</button>
  <button id="flip" class="secondary" hidden>Rotate 90 degrees</button>
</div>
<script type="module" src="/anchor.js"></script>
</body>
</html>
